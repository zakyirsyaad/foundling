name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  strategy:
    name: Strategy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strategy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            strategy/target
          key: strategy-${{ hashFiles('rust-toolchain.toml', 'strategy/Cargo.lock') }}
          restore-keys: strategy-
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint for the host
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the WASM
        run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: Lint the rehearsal WASM
        run: cargo clippy --locked --target wasm32-wasip2 --features rehearsal -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test rehearsal
        run: cargo test --locked --features rehearsal
      - name: Build the WASM and report its hash
        run: |
          ./build.sh | tee "$RUNNER_TEMP/here.txt"
          echo "Strategy WASM: \`$(cut -d' ' -f1 "$RUNNER_TEMP/here.txt")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Get the same hash from another folder
        run: |
          elsewhere="$RUNNER_TEMP/elsewhere"
          mkdir -p "$elsewhere/strategy"
          cp ../rust-toolchain.toml "$elsewhere/"
          cp -R Cargo.toml Cargo.lock manifest.json build.sh src fixtures "$elsewhere/strategy/"
          (cd "$elsewhere/strategy" && ./build.sh) | tee "$RUNNER_TEMP/there.txt"
          test "$(cut -d' ' -f1 "$RUNNER_TEMP/here.txt")" = "$(cut -d' ' -f1 "$RUNNER_TEMP/there.txt")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundling-strategy
          path: strategy/target/wasm32-wasip2/release/foundling-strategy.wasm
          retention-days: 14

  contract:
    name: Contract (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [vault, mock-ref, mock-oracle, mock-outlayer, mock-token]
    defaults:
      run:
        working-directory: contracts/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/${{ matrix.crate }}/target
          key: ${{ matrix.crate }}-${{ hashFiles('rust-toolchain.toml', format('contracts/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: ${{ matrix.crate }}-
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  verifier:
    name: Verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: verifier-${{ hashFiles('rust-toolchain.toml', 'cli/Cargo.lock') }}
          restore-keys: verifier-
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the fetch feature
        run: cargo clippy --locked --all-targets --features fetch -- -D warnings
      - name: Test
        run: cargo test --locked

  offline-verifier:
    name: Offline verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest tests.test_verify_offline tests.test_recheck_obs
      - name: Run the tier 0a checks
        run: python3 verify.py

  recheck-obs:
    name: Recheck obs (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Past prices cannot change, so 1 is a real mismatch. 2 only means a source is down.
      - name: Recheck recorded readings against the archive and Kraken
        run: |
          status=0
          python3 tools/recheck_obs.py tools/fixtures/m10-obs.json || status=$?
          test "$status" -ne 1

  attack-lab:
    name: Attack Lab scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest tests.test_attack_lab

  keeper:
    name: Keeper bot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: >-
          python3 -m unittest tests.test_keeper_rpc tests.test_keeper_near
          tests.test_keeper_bot tests.test_keeper_soak tests.test_keeper_cli

  vault-wasm:
    name: Vault WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/vault/target
          key: vault-wasm-${{ hashFiles('rust-toolchain.toml', 'contracts/vault/Cargo.lock') }}
          restore-keys: vault-wasm-
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-near
        env:
          ARCHIVE: cargo-near-x86_64-unknown-linux-gnu.tar.gz
          SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" --strip-components=1 -C "$HOME/.cargo/bin"
      - name: Build the vault
        working-directory: contracts/vault
        run: cargo near build non-reproducible-wasm --no-embed-abi
      - name: Audit the host imports
        run: python3 tools/wasm_imports.py contracts/vault/target/near/foundling_vault.wasm tools/allowlist.txt
      - name: Report the hash
        run: |
          hash="$(sha256sum contracts/vault/target/near/foundling_vault.wasm | cut -d' ' -f1)"
          echo "Vault WASM: \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundling-vault
          path: contracts/vault/target/near/foundling_vault.wasm
          retention-days: 14

  vault-reproducible:
    name: Vault reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      # The build records the commit, so it has to be the pushed one and not the merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-near
        env:
          ARCHIVE: cargo-near-x86_64-unknown-linux-gnu.tar.gz
          SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" --strip-components=1 -C "$HOME/.cargo/bin"
      - name: Build the vault in the pinned image
        working-directory: contracts/vault
        run: cargo near build reproducible-wasm < /dev/null
      - name: Audit the host imports
        run: python3 tools/wasm_imports.py contracts/vault/target/near/foundling_vault.wasm tools/allowlist.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundling-vault-reproducible-${{ matrix.os }}
          path: contracts/vault/target/near/foundling_vault.wasm
          retention-days: 14

  vault-reproducible-compare:
    name: Vault reproducible hash
    needs: vault-reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: foundling-vault-reproducible-*
      - name: Compare the two builds
        run: |
          sha256sum foundling-vault-reproducible-*/foundling_vault.wasm | tee hashes.txt
          test "$(cut -d' ' -f1 hashes.txt | sort -u | wc -l)" -eq 1
          echo "Vault reproducible WASM: \`$(head -n1 hashes.txt | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

  sandbox:
    name: Sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
            sandbox/target
          key: sandbox-${{ hashFiles('rust-toolchain.toml', 'contracts/*/Cargo.lock', 'sandbox/Cargo.lock') }}
          restore-keys: sandbox-
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: Install cargo-near
        env:
          ARCHIVE: cargo-near-x86_64-unknown-linux-gnu.tar.gz
          SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" --strip-components=1 -C "$HOME/.cargo/bin"
      - name: Format
        working-directory: sandbox
        run: cargo fmt --check
      - name: Lint
        working-directory: sandbox
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the contracts and run the sandbox tests
        run: make sandbox

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run -w web lint
      - name: Typecheck
        run: npm run -w web typecheck
      - name: Unit tests with coverage
        run: npm run -w web test:coverage
      - name: Call table and events match the contract
        run: npm run -w web check:contract
      - name: Exit paths do not import the history API
        run: npm run -w web depcruise
      - name: Production bundle has no mock wallet
        env:
          FOUNDLING_BUNDLE_CHECK: "1"
          NEXT_PUBLIC_NETWORK: mainnet
          NEXT_PUBLIC_VAULT_ID: foundling-vault.near
          NEXT_PUBLIC_RPC_URLS: https://rpc.mainnet.fastnear.com
        run: |
          npm run -w web build
          # Strings that survive minification; the marker comment does not.
          if grep -rq --exclude='*.map' -e "foundling.mock.account" -e "localhost:3199/__tx" web/.next/static web/.next/server; then
            echo "::error::the mock wallet reached the production build"
            exit 1
          fi
      - name: Install the browser
        run: npx -w web playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run -w web e2e
      - name: Audit
        run: npm audit --audit-level=high

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.2
      - name: Audit every lockfile
        run: |
          for crate in strategy cli contracts/vault contracts/mock-ref contracts/mock-oracle \
            contracts/mock-outlayer contracts/mock-token sandbox; do
            cargo audit --file "$crate/Cargo.lock"
          done
      - name: Keep the ignored advisories out of every WASM
        run: |
          for crate in contracts/vault contracts/mock-ref contracts/mock-oracle \
            contracts/mock-outlayer contracts/mock-token; do
            for package in crypto-bigint zstd zstd-safe; do
              if cargo tree --locked --manifest-path "$crate/Cargo.toml" \
                --target wasm32-unknown-unknown -e normal -i "$package" 2>/dev/null | grep -q "$package"; then
                echo "::error::$package reached the WASM of $crate"
                exit 1
              fi
            done
          done

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact'

  attack-lab-run:
    name: Attack Lab (run-all)
    # diangkat jadi wajib (hapus continue-on-error) setelah T7-T9 selesai
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run every core attack
        run: python3 tools/attack.py run-all

  workflow:
    name: Workflow shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that no job can turn a failure green
        run: python3 -m unittest tests.test_ci_workflow
